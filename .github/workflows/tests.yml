name: Tests

# A push to any branch, and a pull request from a fork: a pull request from a branch
# here is checked by the push that made it, not twice
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows, and the one the app is developed on
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyPI's Qt is self-contained but for what every desktop has: these let it run
      # offscreen on the runner
      - name: Install the libraries Qt needs
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install the app
        run: pip install -e '.[dev]'

      # Offscreen, in a home of their own: tests/conftest.py sees to both
      - name: Test
        run: pytest -rs
