name: Tests

# A push to any branch, and a pull request from a fork: a pull request from a branch
# here is checked by the push that made it, not twice
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Fedora, as the app is developed on: exiftool comes from the distribution, and
    # Ubuntu's is much older. Everything else is from PyPI and the same on both
    container: fedora:44
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows, and the one the app is developed on
        python-version: ["3.12", "3.14"]
    steps:
      # Besides Python and exiftool: the few libraries PyPI's Qt needs to run offscreen
      - name: Install what the app and its tests need
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git python${{ matrix.python-version }} perl-Image-ExifTool
          mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs dejavu-sans-fonts

      - uses: actions/checkout@v5

      # The steps of a container run as root, and root is refused nothing: the tests of
      # what happens when a file cannot be read or written would be skipped
      - name: Hand the checkout to an ordinary user
        run: |
          useradd --create-home ci
          chown -R ci "$GITHUB_WORKSPACE"

      - name: Install the app
        run: |
          runuser -u ci -- env HOME=/home/ci bash -e -c "
            python${{ matrix.python-version }} -m venv /home/ci/venv
            /home/ci/venv/bin/pip install --disable-pip-version-check -e '.[dev]'
          "

      # Offscreen, in a home of their own: tests/conftest.py sees to both. A test that
      # needs exiftool fails here rather than being skipped
      - name: Test
        run: >
          runuser -u ci -- env HOME=/home/ci LUMINA_REQUIRE_EXIFTOOL=1
          /home/ci/venv/bin/pytest -rs
